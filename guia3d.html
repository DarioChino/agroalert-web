<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroAlert · Guía 3D del armado del nodo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #card {
    position: fixed; top: 14px; left: 14px; width: min(380px, calc(100vw - 28px));
    background: rgba(12, 22, 18, .93); color: #e6efe9; border: 1px solid rgba(120, 200, 160, .35);
    border-radius: 18px; padding: 14px 16px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    z-index: 10;
  }
  #topRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #stepNum { font-size: 11px; letter-spacing: 2px; color: #7fd0a5; font-weight: 700; }
  #practiceBtn { padding: 6px 10px; border-radius: 999px; border: 1px solid #3d5a4b; background: #16241d; color: #cfe8da; font-size: 12px; font-weight: 700; cursor: pointer; flex: none; }
  #practiceBtn.on { background: #b8860b; border-color: #b8860b; color: #fff; }
  #title { margin: 6px 0 8px; font-size: 19px; line-height: 1.2; color: #fff; }
  #text { margin: 0 0 10px; font-size: 13.5px; line-height: 1.55; color: #c9d8cf; }
  #text b { color: #fff; }
  #feedback { min-height: 20px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  #feedback.ok { color: #57c98f; } #feedback.bad { color: #e8746b; }
  #dots { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
  #dots span { width: 9px; height: 9px; border-radius: 50%; background: #2b3a33; }
  #dots span.on { background: #57c98f; }
  #btns { display: flex; gap: 8px; }
  button.nav { flex: 1; padding: 11px 8px; border-radius: 12px; border: 1px solid #3d5a4b; background: #16241d; color: #dfeee5; font-size: 14px; font-weight: 600; cursor: pointer; }
  button#next { background: #1f7a52; border-color: #1f7a52; }
  button:disabled { opacity: .35; cursor: default; }
  a { color: #7fd0a5; }
  #legend { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    background: rgba(14,24,20,.85); padding: 7px 14px; border-radius: 999px; z-index: 10; }
  #legend span { color: #c9d8cf; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 14px; height: 6px; border-radius: 3px; display: inline-block; }
  @media (max-width: 640px) { #card { top: auto; bottom: 52px; max-height: 52vh; overflow-y: auto; } #legend { font-size: 10px; gap: 8px; } }
</style>
</head>
<body>
<div id="card">
  <div id="topRow">
    <div id="stepNum"></div>
    <button id="practiceBtn">🎓 Modo práctica</button>
  </div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div id="feedback"></div>
  <div id="dots"></div>
  <div id="btns">
    <button class="nav" id="prev">◀ Atrás</button>
    <button class="nav" id="next">Siguiente ▶</button>
  </div>
</div>
<div id="legend">
  <span><i style="background:#d23c3c"></i>5V (+)</span>
  <span><i style="background:#3a3a3a;outline:1px solid #666"></i>GND (−)</span>
  <span><i style="background:#3567d2"></i>datos del sensor</span>
  <span><i style="background:#d2b23c"></i>señal / órdenes</span>
  <span><i style="background:#2fa05a"></i>Bluetooth</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
if (typeof THREE === "undefined") {
  document.getElementById("text").textContent = "No se pudo cargar el motor 3D. Conéctate a internet y recarga la página.";
} else {
// ============================ ESCENA BASE ============================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10161a);
scene.fog = new THREE.Fog(0x10161a, 34, 75);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 200);
camera.position.set(14, 13, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2.05; controls.minDistance = 5; controls.maxDistance = 60;
scene.add(new THREE.AmbientLight(0xffffff, .6));
const sun = new THREE.DirectionalLight(0xffffff, .95); sun.position.set(10, 18, 8); scene.add(sun);
const fill = new THREE.DirectionalLight(0xaad4ff, .35); fill.position.set(-12, 8, -10); scene.add(fill);
const mesa = new THREE.Mesh(new THREE.BoxGeometry(60, .3, 40), new THREE.MeshStandardMaterial({ color: 0x27313a, roughness: .9 }));
mesa.position.y = -.15; scene.add(mesa);

const focusables = {};   // nombre -> grupo (para resaltar y para el quiz)
const shown = {};        // nombre -> paso en que aparece
function track(obj, name, step) {
  if (name) { focusables[name] = obj; obj.userData.quizName = name; }
  if (step) shown[name] = step;
  scene.add(obj); return obj;
}
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .55, metalness: .08 });

// ============================ ETIQUETAS FLOTANTES ============================
function label(text, pos, big) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(8,18,14,.88)";
  const w = g.measureText(text).width;
  g.beginPath(); g.roundRect ? g.roundRect(4, 20, 504, 88, 24) : g.rect(4, 20, 504, 88); g.fill();
  g.strokeStyle = "#3d5a4b"; g.lineWidth = 4; g.stroke();
  g.fillStyle = big ? "#ffd872" : "#7fd0a5"; g.font = `bold ${big ? 52 : 46}px sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 256, 66);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(big ? 4.6 : 3.4, big ? 1.15 : .85, 1);
  s.position.set(...pos); s.raycast = function(){}; scene.add(s); return s;
}

// ============================ ARDUINO UNO R3 ============================
const arduino = new THREE.Group();
const pcb = new THREE.Mesh(new THREE.BoxGeometry(5.8, .18, 2.7), mat(0x00838a)); pcb.position.y = .09; arduino.add(pcb);
const usb = new THREE.Mesh(new THREE.BoxGeometry(1.05, .6, .75), mat(0xb8bcc0)); usb.position.set(-2.45, .4, 0); arduino.add(usb);
const usbTop = new THREE.Mesh(new THREE.BoxGeometry(.9, .12, .6), mat(0x50565c)); usbTop.position.set(-2.45, .68, 0); arduino.add(usbTop);
const jack = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .6, 12), mat(0x141414)); jack.rotation.z = Math.PI/2; jack.position.set(2.3, .45, 0); arduino.add(jack);
const headerF = new THREE.Mesh(new THREE.BoxGeometry(4.0, .3, .38), mat(0x101010)); headerF.position.set(-.2, .28, 1.15); arduino.add(headerF);
const headerL = new THREE.Mesh(new THREE.BoxGeometry(.38, .3, 1.6), mat(0x101010)); headerL.position.set(-2.7, .28, .3); arduino.add(headerL);
const chip = new THREE.Mesh(new THREE.BoxGeometry(1.4, .16, .5), mat(0x0a0a0a)); chip.position.set(.3, .24, -.5); arduino.add(chip);
const resetBtn = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, .1, 12), mat(0xd8d8d8)); resetBtn.position.set(-1.6, .24, -.9); arduino.add(resetBtn);
arduino.position.set(-5.5, 0, -5.4); track(arduino, "arduino");

// pines del Arduino: bolitas de color + etiqueta (clicables en modo práctica)
const PIN = {
  "5V":  [-8.0, .55, -4.22, 0xd23c3c],  "GND": [-7.5, .55, -4.22, 0x3a3a3a],
  "D2":  [-6.7, .55, -4.22, 0xe8c84a],  "D3":  [-6.2, .55, -4.22, 0xe8c84a],
  "D4":  [-5.7, .55, -4.22, 0xe8c84a],  "D5":  [-5.2, .55, -4.22, 0xe8c84a],
  "D8":  [-4.7, .55, -4.22, 0xe8c84a],  "D10": [-4.2, .55, -4.22, 0xe8c84a],
  "D11": [-3.7, .55, -4.22, 0xe8c84a]
};
for (const k in PIN) {
  const [x, y, z, c] = PIN[k];
  const dot = new THREE.Mesh(new THREE.SphereGeometry(.11, 12, 10), mat(c));
  dot.position.set(x, y, z); dot.userData.quizName = "pin-" + k; scene.add(dot); focusables["pin-" + k] = dot;
  label(k, [x, y + .62, z]);
}
label("ARDUINO UNO R3  (el cerebro 🧠)", [-5.5, 2.4, -5.4], true);

// ============================ PROTOBOARD ============================
const bb = new THREE.Mesh(new THREE.BoxGeometry(13, .35, 7.6), mat(0xf2f0e8)); bb.position.set(0, .17, .8); track(bb, "protoboard");
const chan = new THREE.Mesh(new THREE.BoxGeometry(12.6, .06, .35), mat(0xd9d5c8)); chan.position.set(0, .36, .8); scene.add(chan);
[[-3.55, 0xd23c3c], [-3.2, 0x2b4a5a], [3.2, 0xd23c3c], [3.55, 0x2b4a5a]].forEach(([z, c]) => {
  const r = new THREE.Mesh(new THREE.BoxGeometry(12.4, .07, .2), mat(c));
  r.position.set(0, .37, .8 + z); scene.add(r);
});
const holeCount = 25 * 11;
const holes = new THREE.InstancedMesh(new THREE.CylinderGeometry(.045, .045, .08, 6), mat(0x7c7c72), holeCount);
let hi = 0; const Mx = new THREE.Matrix4();
for (let x = -6; x <= 6; x += .5) for (let z = -2.7; z <= 2.7; z += .54) { Mx.setPosition(x, .37, .8 + z); holes.setMatrixAt(hi++, Mx); }
scene.add(holes);
label("+  (5V)", [-5.4, .8, .8 - 3.55]); label("−  (GND)", [-5.4, .8, .8 - 3.2]);
label("+  (5V)", [-5.4, .8, .8 + 3.2]); label("−  (GND)", [-5.4, .8, .8 + 3.55]);
label("PROTOBOARD (la parrilla de huequitos)", [0, 2.1, .8 - 4.4], true);

// ============================ COMPONENTES ============================
// DHT11 — el termómetro
const dht = new THREE.Group();
const dhtBody = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.1, .9), mat(0x2f6fb2)); dhtBody.position.y = .9; dht.add(dhtBody);
for (let i = -1; i <= 1; i++) {
  const slit = new THREE.Mesh(new THREE.BoxGeometry(.16, .5, .06), mat(0x1d4a80));
  slit.position.set(i * .35, 1.05, .46); dht.add(slit);
}
[.42, -.42, 0].forEach(x => { const l = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .65, 6), mat(0xd8d4c8)); l.position.set(x, .32, 0); dht.add(l); });
dht.position.set(4.8, .35, -1.8); track(dht, "dht", 4);
label("DHT11 · termómetro 🌡️", [4.8, 2.35, -1.8]);

// LEDs — la carita del semáforo
function led(x, color, name, step) {
  const g = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.34, 18, 12), mat(color)); dome.position.y = .95; g.add(dome);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(.36, .36, .12, 18), mat(0xb8bcc0)); ring.position.y = .62; g.add(ring);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .45, 18), mat(color)); base.position.y = .38; g.add(base);
  const legA = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, .8, 6), mat(0xd8d8d8)); legA.position.set(-.2, .05, 0); g.add(legA);
  const legC = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, .6, 6), mat(0xd8d8d8)); legC.position.set(.2, .15, 0); g.add(legC);
  g.position.set(x, .35, -1.3); track(g, name, step);
}
led(-4.5, 0x35d07c, "ledVerde", 5);
led(-3.1, 0xf2c23e, "ledAmarillo", 6);
led(-1.7, 0xe8564d, "ledRojo", 7);
label("LED VERDE · D3", [-4.5, 1.95, -1.3]); label("LED AMARILLO · D4", [-3.1, 1.95, -1.3]); label("LED ROJO · D5", [-1.7, 1.95, -1.3]);
label("pata LARGA (+) 😊", [-4.85, .6, -.55]);

// Resistencias — el freno de la corriente
function resistor(x, z1, z2, name, step, bands, txt, ty) {
  const g = new THREE.Group();
  const len = Math.abs(z2 - z1);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, len*.55, 10), mat(0xd8b98a));
  body.rotation.x = Math.PI/2; body.position.set(0, .18, (z1+z2)/2); g.add(body);
  bands.forEach((c, i) => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(.125, .125, .1, 10), mat(c));
    b.rotation.x = Math.PI/2; b.position.set(0, .18, (z1+z2)/2 - len*.16 + i*.16); g.add(b);
  });
  const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, len*.45, 6), mat(0xb8b8b8));
  leg1.rotation.x = Math.PI/2; leg1.position.set(0, .18, z1 + len*.225); g.add(leg1);
  const leg2 = leg1.clone(); leg2.position.z = z2 - len*.225; g.add(leg2);
  g.position.set(x, .35, 0); track(g, name, step);
  label(txt, [x, ty || 1.6, .8 + (z1+z2)/2]);
}
resistor(-4.72, -1.3, .5, "r220v", 5, [0x8a4b2a, 0xd23c3c, 0x8a4b2a], "220Ω", 1.35);
resistor(-3.32, -1.3, .5, "r220a", 6, [0x8a4b2a, 0xd23c3c, 0x8a4b2a], "220Ω", 1.35);
resistor(-1.92, -1.3, .5, "r220r", 7, [0x8a4b2a, 0xd23c3c, 0x8a4b2a], "220Ω", 1.35);
resistor(2.3, .3, 1.45, "r1k", 10, [0x8a4b2a, 0x141414, 0xd23c3c], "1 kΩ", 1.5);
resistor(2.3, 1.45, 2.6, "r2k", 10, [0xd23c3c, 0x141414, 0xd23c3c], "2 kΩ", 1.5);

// Módulo relé — el interruptor de la bomba
const relay = new THREE.Group();
const rbox = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.15, 1.7), mat(0x1f5fa8)); rbox.position.y = .62; relay.add(rbox);
const rcube = new THREE.Mesh(new THREE.BoxGeometry(.95, .65, .75), mat(0x2b7fd4)); rcube.position.set(.3, 1.05, 0); relay.add(rcube);
[-.6, -.2, .2].forEach(x => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .22, 10), mat(0xb8bcc0));
  s.position.set(x, .3, -.9); relay.add(s);
});
const rled = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 8), mat(0xe8564d, 0x000000)); rled.position.set(.75, .95, .8); relay.add(rled);
relay.position.set(9.6, 0, -.7); track(relay, "relay", 8);
label("RELÉ · interruptor de la bomba 💦", [9.6, 2.5, -.7], true);

// HC-05 — el oído y la boca Bluetooth
const hc = new THREE.Group();
const pcb2 = new THREE.Mesh(new THREE.BoxGeometry(1.8, .14, 1.0), mat(0x14532d)); pcb2.position.y = .42; hc.add(pcb2);
const shield = new THREE.Mesh(new THREE.BoxGeometry(1.05, .3, .7), mat(0xb8bcc0)); shield.position.set(-.15, .62, 0); hc.add(shield);
const ant = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, 1.0, 10), mat(0x8a8f94));
ant.rotation.x = Math.PI/2; ant.position.set(-.15, .62, -.45); hc.add(ant);
const btn = new THREE.Mesh(new THREE.CylinderGeometry(.15, .15, .1, 12), mat(0xd8d8d8)); btn.position.set(.62, .52, .25); hc.add(btn);
for (let i = 0; i < 6; i++) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, .3, 6), mat(0xd4b24a));
  p.position.set(-.5 + i * .3, .22, -.3); hc.add(p);
}
hc.position.set(3.6, .35, 1.8); track(hc, "hc05", 9);
label("HC-05 · Bluetooth 📡", [3.6, 2.15, 1.8]);

// ============================ CABLES ============================
const WIREC = { rojo: 0xd23c3c, negro: 0x2e2e2e, azul: 0x3567d2, amarillo: 0xd2b23c, verde: 0x2fa05a };
function wire(a, b, color, step, name) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const mid = va.clone().add(vb).multiplyScalar(.5); mid.y = Math.max(va.y, vb.y) + 1.2;
  const g = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([va, mid, vb]), 24, .075, 8), mat(WIREC[color]));
  g.add(tube);
  [va, vb].forEach(p => {
    const end = new THREE.Mesh(new THREE.SphereGeometry(.11, 10, 8), mat(WIREC[color]));
    end.position.copy(p); g.add(end);
  });
  g.userData.step = step; scene.add(g);
  wires.push(g); if (name) focusables[name] = g;
  return g;
}
const wires = [];
const B = (x, z) => [x, .45, .8 + z];   // hueco de la protoboard
// paso 3: alimentación
wire([-7.6, .6, -4.4], [-3.6, .45, .8 - 3.5], "rojo", 3, "w5v");
wire([-7.1, .6, -4.4], [-3.1, .45, .8 - 3.2], "negro", 3, "wgnd");
// paso 4: DHT11
wire(B(4.5, -1.8), [-6.55, .6, -4.4], "azul", 4, "wdht");
wire(B(4.8, -1.8), [-5.0, .45, .8 - 3.18], "rojo", 4);
wire(B(5.1, -1.8), [-4.4, .45, .8 - 3.5], "negro", 4);
// pasos 5-7: LEDs — ánodo(pata larga) → resistencia → pin; cátodo → GND
[[-4.5, -4.72, "D3", 5], [-3.1, -3.32, "D4", 6], [-1.7, -1.92, "D5", 7]].forEach(([x, rx, pin, st]) => {
  wire(B(x - .2, -1.3), B(rx, .5), "amarillo", st);
  wire(B(rx, .5), PIN[pin].slice(0, 3), "amarillo", st, "w" + pin);
  wire(B(x + .2, -1.3), [x + .2, .45, .8 + 3.18], "negro", st);
});
// paso 8: relé
wire([-4.55, .6, -4.4], [9.0, .5, -1.62], "amarillo", 8, "wrel");
wire([8.9, .5, .1], [-2.6, .45, .8 + 3.18], "rojo", 8);
wire([9.35, .5, .1], [-2.1, .45, .8 + 3.5], "negro", 8);
// paso 9: HC-05
wire(B(3.05, 1.8), [-4.0, .45, .8 - 3.18], "rojo", 9);
wire(B(3.3, 1.8), [-3.5, .45, .8 - 3.5], "negro", 9);
wire(B(4.0, 1.8), [-4.05, .6, -4.4], "amarillo", 9, "wtx");
// paso 10: divisor RXD
wire([-3.55, .6, -4.4], B(2.3, .3), "verde", 10, "wdiv1");
wire(B(2.3, 1.45), B(2.85, 1.8), "verde", 10, "wdiv2");
wire(B(2.3, 2.6), [-2.6, .45, .8 - 3.5], "negro", 10, "wdiv3");

// ============================ PASOS (modo cuéntaselo a un peque) ============================
const STEPS = [
  { t: "🏁 Mira todo antes de tocar", x: "Gira la escena con el dedo 👆.\n¿Lo ves? El tablita <b>verde</b> es el <b>ARDUINO</b>. La tabla <b>blanca con huequitos</b> es la <b>PROTOBOARD</b>. Y los cacharritos de colores son los <b>módulos</b>.\nVamos a conectarlos poquito a poquito. ¡Sin apuro!", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [] },
  { t: "🧠 El Arduino: el cerebro", x: "El Arduino <b>piensa</b> por todo el proyecto: mide, decide y enciende.\nArriba tiene <b>pinitas con nombre</b> (D2, D3… 5V, GND): ahí enchufamos los cables.\n👉 <b>Practica:</b> toca el Arduino en la escena.", cam: { p: [-6, 7, 1], l: [-5.5, .5, -5] }, hi: ["arduino"], quiz: { ask: "Toca el ARDUINO (la tablita verde con el USB plateado)", target: "arduino" } },
  { t: "🧇 La protoboard: la parrilla", x: "Es una tabla llena de <b>huequitos</b> donde clavamos las patitas.\nLos huequitos de la <b>misma fila en corto</b> están unidos por adentro: la corriente viaja entre ellos.\nLas líneas de colores de los bordes son los <b>rieles</b>: rojo = 5V (+), azul = GND (−).\n👉 <b>Practica:</b> toca la protoboard.", cam: { p: [2, 9, 9], l: [0, .3, .8] }, hi: ["protoboard"], quiz: { ask: "Toca la PROTOBOARD (la tabla blanca)", target: "protoboard" } },
  { t: "⚡ Primero: la comida (5V y GND)", x: "Todo módulo necesita «comer» electricidad:\n• Cable <b>ROJO</b>: del pin <b>5V</b> del Arduino → al riel <b>rojo</b>.\n• Cable <b>NEGRO</b>: del pin <b>GND</b> → al riel <b>azul</b>.\nAhora todos los módulos pueden comer de esos rieles. 🍽️\n👉 <b>Practica:</b> toca el pin <b>5V</b> del Arduino.", cam: { p: [-9, 7, 1], l: [-5.5, .4, -3.5] }, hi: ["w5v", "wgnd"], quiz: { ask: "Toca el pin 5V del Arduino (la bolita ROJA con su nombre)", target: "pin-5V" } },
  { t: "🌡️ El DHT11: el termómetro", x: "Este cubito <b>azul</b> siente el frío y el calor del huerto.\n• Cable <b>AZUL</b>: pin S (datos) → pin <b>D2</b> («aquí te cuento lo que siento»).\n• <b>ROJO</b>: VCC → riel rojo. <b>NEGRO</b>: GND → riel azul.\n👉 <b>Practica:</b> toca el termómetro.", cam: { p: [9, 7, -1], l: [4.5, .8, -2] }, hi: ["dht", "wdht"], quiz: { ask: "Toca el DHT11 (el cubito AZUL)", target: "dht" } },
  { t: "🟢 El LED verde: «todo tranqui»", x: "Un LED tiene pata <b>LARGA</b> (+, ánodo) y pata <b>CORTA</b> (−, cátodo).\nLa resistencia <b>220Ω</b> (franjas café-rojo-café) va en la fila de la pata larga: es un <b>freno</b> para que no se queme. 🔥🚫\nLuego: cable <b>AMARILLO</b> desde esa fila → pin <b>D3</b>, y <b>NEGRO</b> desde la pata corta → riel azul.\n👉 <b>Practica:</b> toca el LED verde.", cam: { p: [-7.5, 6, 3.5], l: [-4.5, .5, -1] }, hi: ["ledVerde", "r220v", "wD3"], quiz: { ask: "Toca el LED VERDE (la bolita verde con patitas)", target: "ledVerde" } },
  { t: "🟡 El LED amarillo: «¡abrígate!»", x: "Mismo juguete, una fila al lado: resistencia <b>220Ω</b> en la pata larga, cable <b>AMARILLO</b> → pin <b>D4</b>, y NEGRO de la pata corta → riel azul.\nPrende cuando empieza a refrescar (5-10 °C).", cam: { p: [-6.5, 6, 4.5], l: [-3.1, .5, -1] }, hi: ["ledAmarillo", "r220a", "wD4"], quiz: { ask: "Toca el LED AMARILLO", target: "ledAmarillo" } },
  { t: "🔴 El LED rojo: «¡HELADA!»", x: "El tercer LED, mismo molde: resistencia 220Ω, cable <b>AMARILLO</b> → pin <b>D5</b>, NEGRO → riel azul.\nCuando prende este, el relé hace <b>CLIC</b> y arranca la bomba. 💦", cam: { p: [-5.5, 6, 5.5], l: [-1.7, .5, -1] }, hi: ["ledRojo", "r220r", "wD5"], quiz: { ask: "Toca el LED ROJO", target: "ledRojo" } },
  { t: "💦 El relé: el interruptor de la bomba", x: "El relé es un <b>interruptor</b> que el Arduino aprieta solito:\n• Cable <b>AMARILLO</b>: pin IN → <b>D8</b> («cuando haya helada, aprieta»).\n• ROJO: VCC → riel rojo. NEGRO: GND → riel azul.\nAl activarse hace <b>CLIC</b> 🔊. Los tornillos grandes quedan <b>VACÍOS</b> (¡nada de 220V en el banco!).", cam: { p: [12, 7, 4], l: [8.5, .6, -1] }, hi: ["relay", "wrel"], quiz: { ask: "Toca el MÓDULO RELÉ (el cubito azul con tornillos)", target: "relay" } },
  { t: "📡 El HC-05: el oído y la boca", x: "Este módulo <b>escucha</b> tu celular y <b>habla</b> con él:\n• ROJO: VCC → riel rojo. NEGRO: GND → riel azul.\n• Cable <b>AMARILLO</b>: TXD del módulo → pin <b>D10</b> (va directo, sin freno).\nSu lucecita parpadea rápido cuando espera conexión. ✨", cam: { p: [7, 6, 6], l: [3.6, .6, 1.5] }, hi: ["hc05", "wtx"], quiz: { ask: "Toca el HC-05 (la tarjetita verde con tapita plateada)", target: "hc05" } },
  { t: "🛑 El freno del RXD (¡MUY importante!)", x: "El Arduino grita a <b>5V</b> y el HC-05 solo aguanta <b>3.3V</b> en su oreja (RXD). Le ponemos DOS frenos en fila:\n• Cable <b>VERDE</b>: pin <b>D11</b> → hueco A.\n• <b>1 kΩ</b> (café-negro-rojo) del hueco A al B.\n• Del hueco B → cable <b>VERDE</b> → RXD.\n• <b>2 kΩ</b> (rojo-negro-rojo) del hueco B hacia abajo y NEGRO → riel azul.\nSin este freno, el HC-05 se puede dañar. 😱", cam: { p: [5, 6.5, 6.5], l: [2.3, .5, 1.3] }, hi: ["r1k", "r2k", "wdiv1", "wdiv2", "wdiv3"], quiz: { ask: "Toca el pin D11 del Arduino (de donde sale el cable verde)", target: "pin-D11" } },
  { t: "✅ Revisión con la escena", x: "Compara tu mesa con el 3D:\n• 3 LEDs con sus 220Ω en D3, D4 y D5.\n• Relé con IN en D8.\n• HC-05 en D10/D11 con sus 2 frenos.\nAl enchufar el USB: LED <b>verde</b> fijo, relé callado y HC-05 <b>parpadeando rápido</b>. Si algo no coincide, vuelve a ese paso. 🔍", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [] },
  { t: "🎉 ¡Armado! Ahora el cerebro necesita su programa", x: "Conecta el Arduino al PC por USB y sube el firmware siguiendo <b>docs/CABLEADO_ARDUINO.md</b> (ahí está la guía del IDE y la librería DHT).\nLuego: Monitor Serie a <b>9600</b> para ver las tramas, y después a <b>emparejar el HC-05</b> con la app (docs/BLUETOOTH.md).\n¡Éxito en la demo, campeón! 🏆", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [], link: "https://github.com/DarioChino/agroalert-araucania/blob/main/docs/CABLEADO_ARDUINO.md" }
];

// ============================ VISIBILIDAD ============================
function applyStep(i) {
  for (const name in shown) focusables[name].visible = i >= shown[name];
  wires.forEach(w => w.visible = i >= w.userData.step);
}
applyStep(0);

// ============================ UI + QUIZ ============================
const $ = id => document.getElementById(id);
let cur = 0, practice = false, solved = false;
$("dots").innerHTML = STEPS.map(() => "<span></span>").join("");
function feedback(txt, cls) { const f = $("feedback"); f.textContent = txt; f.className = cls || ""; }
function show(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur]; solved = false; feedback("");
  $("stepNum").textContent = `PASO ${cur+1} DE ${STEPS.length}`;
  $("title").textContent = s.t;
  let body = practice && s.quiz ? `🎓 <b>PRACTICA:</b> ${s.quiz.ask}` : s.x;
  $("text").innerHTML = body + (s.link ? `<br><br><a href="${s.link}" target="_blank">Abrir guía de compilación ▸</a>` : "");
  $("prev").disabled = cur === 0;
  $("next").textContent = cur === STEPS.length - 1 ? "↻ Volver al inicio" : "Siguiente ▶";
  [...$("dots").children].forEach((d, k) => d.className = k <= cur ? "on" : "");
  applyStep(cur);
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur === STEPS.length - 1 ? 0 : cur + 1);
$("practiceBtn").onclick = () => { practice = !practice; $("practiceBtn").className = practice ? "on" : ""; show(cur); };
addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
show(0);

// clic para el modo práctica (distingue clic de arrastre)
const ray = new THREE.Raycaster(); let downXY = null;
renderer.domElement.addEventListener("pointerdown", e => downXY = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!practice || !downXY) return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  downXY = null;
  if (Math.hypot(dx, dy) > 6) return;               // fue arrastre, no clic
  const ndc = new THREE.Vector2(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.quizName) o = o.parent;
    const name = o ? o.userData.quizName : null;
    const s = STEPS[cur];
    if (s.quiz && name === s.quiz.target) {
      solved = true; feedback("¡BIEN! 🎉 Era eso. Toca «Siguiente».", "ok"); applyStep(cur); return;
    }
    if (name) { feedback("Casi… intenta otra vez 😉", "bad"); return; }
  }
  feedback("Toca una pieza con etiqueta 😉", "bad");
});

// ============================ ANIMACIÓN ============================
const camPos = new THREE.Vector3(14, 13, 20), camTarget = new THREE.Vector3(0, 0, 0);
const mats = [];
for (const n in focusables) focusables[n].traverse(o => { if (o.material && o.material.emissive) mats.push([o.material, 0]); });
mats.forEach(([m]) => m.userData.e0 = m.emissive ? m.emissive.getHex() : 0);
function animate(t) {
  requestAnimationFrame(animate);
  const s = STEPS[cur];
  camPos.lerp(new THREE.Vector3(...s.cam.p), .06);
  camTarget.lerp(new THREE.Vector3(...s.cam.l), .06);
  camera.position.copy(camPos); controls.target.copy(camTarget);
  const k = (Math.sin(t * .005) + 1) / 2;
  for (const [m] of mats) m.emissive.setHex(m.userData.e0);
  for (const name of (s.hi || [])) {
    if (focusables[name]) focusables[name].traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setScalar(.35 * k); });
  }
  if (solved && s.quiz && focusables[s.quiz.target]) {
    focusables[s.quiz.target].traverse(o => { if (o.material && o.material.emissive) o.material.emissive.setScalar(.3 * k); });
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
}
</script>
