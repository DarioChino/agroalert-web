<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroAlert · Guía 3D del armado del nodo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #card {
    position: fixed; top: 16px; left: 16px; width: min(360px, calc(100vw - 32px));
    background: rgba(14, 24, 20, .92); color: #e6efe9; border: 1px solid rgba(120, 200, 160, .35);
    border-radius: 18px; padding: 16px 18px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    backdrop-filter: blur(6px); z-index: 10;
  }
  #stepNum { font-size: 11px; letter-spacing: 2px; color: #7fd0a5; font-weight: 700; }
  #title { margin: 6px 0 8px; font-size: 19px; line-height: 1.2; color: #fff; }
  #text { margin: 0 0 12px; font-size: 13.5px; line-height: 1.55; color: #c9d8cf; white-space: pre-line; }
  #dots { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
  #dots span { width: 9px; height: 9px; border-radius: 50%; background: #2b3a33; }
  #dots span.on { background: #57c98f; }
  #btns { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 11px 8px; border-radius: 12px; border: 1px solid #3d5a4b;
    background: #16241d; color: #dfeee5; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button#next { background: #1f7a52; border-color: #1f7a52; }
  button:disabled { opacity: .35; cursor: default; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: #9fb4a8;
    font-size: 12px; background: rgba(14,24,20,.8); padding: 7px 14px; border-radius: 999px; z-index: 10; }
  a { color: #7fd0a5; }
  @media (max-width: 640px) { #card { top: auto; bottom: 56px; } #hint { bottom: 10px; font-size: 11px; } }
</style>
</head>
<body>
<div id="card">
  <div id="stepNum"></div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div id="dots"></div>
  <div id="btns">
    <button id="prev">◀ Atrás</button>
    <button id="next">Siguiente ▶</button>
  </div>
</div>
<div id="hint">Arrastra para rotar · Rueda o pellizco para acercar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
if (typeof THREE === "undefined") {
  document.getElementById("text").textContent = "No se pudo cargar el motor 3D. Revisa tu conexión a internet y recarga.";
} else {
// ---------- Escena ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10161a);
scene.fog = new THREE.Fog(0x10161a, 30, 70);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 200);
camera.position.set(14, 14, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2.05; controls.minDistance = 5; controls.maxDistance = 55;
scene.add(new THREE.AmbientLight(0xffffff, .55));
const dir = new THREE.DirectionalLight(0xffffff, .9); dir.position.set(10, 18, 8); scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xaad4ff, .35); dir2.position.set(-12, 8, -10); scene.add(dir2);
// mesa
const mesa = new THREE.Mesh(new THREE.BoxGeometry(60, .3, 40), new THREE.MeshStandardMaterial({ color: 0x27313a, roughness: .9 }));
mesa.position.y = -.15; scene.add(mesa);

const focusables = {};   // objetos que se pueden resaltar
const stepObjects = {};  // objetos que aparecen a partir de cierto paso
function track(obj, name, step) {
  obj.traverse(o => { o.userData.root = obj; });
  if (name) focusables[name] = obj;
  if (step) stepObjects[name] = { obj, step };
  scene.add(obj); return obj;
}
const mat = (c, e) => new THREE.MeshStandardMaterial({ color: c, roughness: .55, metalness: .1, emissive: e || 0x000000 });

// ---------- Arduino Uno ----------
const arduino = new THREE.Group();
const pcb = new THREE.Mesh(new THREE.BoxGeometry(5.6, .18, 2.6), mat(0x00838a)); pcb.position.y = .09; arduino.add(pcb);
const usb = new THREE.Mesh(new THREE.BoxGeometry(1.0, .55, .7), mat(0xb8bcc0, 0x30343a)); usb.position.set(-2.35, .35, 0); arduino.add(usb);
const jack = new THREE.Mesh(new THREE.BoxGeometry(.9, .5, .75), mat(0x1a1a1a)); jack.position.set(2.25, .35, 0); arduino.add(jack);
const header1 = new THREE.Mesh(new THREE.BoxGeometry(3.6, .3, .34), mat(0x141414)); header1.position.set(-.5, .28, 1.15); arduino.add(header1);
const header2 = new THREE.Mesh(new THREE.BoxGeometry(1.4, .3, .34), mat(0x141414)); header2.position.set(-2.45, .28, .55); arduino.add(header2);
arduino.position.set(-5.5, 0, -5.4); track(arduino, "arduino");

// pines del Arduino (coordenadas mundo, sobre el header frontal)
const PIN = {
  "5V":  [-8.1, .5, -4.2], "GND": [-7.65, .5, -4.2],
  "D2":  [-6.6, .5, -4.2], "D3":  [-6.15, .5, -4.2], "D4": [-5.7, .5, -4.2], "D5": [-5.25, .5, -4.2],
  "D8":  [-4.35, .5, -4.2], "D10": [-3.9, .5, -4.2], "D11": [-3.45, .5, -4.2]
};
function pinLabel(text, pos) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(10,20,16,.85)"; g.fillRect(0, 0, 128, 64);
  g.fillStyle = "#7fd0a5"; g.font = "bold 34px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 64, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(1.1, .55, 1); s.position.set(pos[0], pos[1] + .55, pos[2]); scene.add(s);
}
for (const k in PIN) pinLabel(k, PIN[k]);

// ---------- Protoboard ----------
const bb = new THREE.Mesh(new THREE.BoxGeometry(13, .35, 7.4), mat(0xf2f0e8)); bb.position.set(0, .17, .8); track(bb, "protoboard");
const railM = c => new THREE.MeshStandardMaterial({ color: c, roughness: .5 });
[[-3.35, 0xd23c3c], [-3.0, 0x2b3a45], [3.0, 0xd23c3c], [3.35, 0x2b3a45]].forEach(([z, c]) => {
  const r = new THREE.Mesh(new THREE.BoxGeometry(12.4, .06, .16), railM(c));
  r.position.set(0, .38, .8 + z); scene.add(r);
});
const holeGeo = new THREE.CylinderGeometry(.035, .035, .06, 6);
const holeMat = mat(0x8a8a80);
const holes = new THREE.InstancedMesh(holeGeo, holeMat, 25*11);
let hi = 0; const M = new THREE.Matrix4();
for (let x = -6; x <= 6; x += .5) for (let z = -2.6; z <= 2.6; z += .5) {
  M.setPosition(x, .37, .8 + z); holes.setMatrixAt(hi++, M);
}
scene.add(holes);

// ---------- Componentes ----------
// DHT11
const dht = new THREE.Group();
const dhtBody = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.05, .85), mat(0x2f6fb2)); dhtBody.position.y = .85; dht.add(dhtBody);
[[.35, 0xe8e4d8], [-.35, 0xe8e4d8], [0, 0xcfd8dc]].forEach(([x, c]) => {
  const l = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .6, 6), mat(c));
  l.position.set(x, .3, 0); dht.add(l);
});
dht.position.set(4.6, .35, -1.7); track(dht, "dht", 3);
// LEDs
function led(x, color, name, step) {
  const g = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.32, 18, 12), mat(color, 0x000000)); dome.position.y = .85; g.add(dome);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .5, 18), mat(color)); base.position.y = .55; g.add(base);
  const legA = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .75, 6), mat(0xcccccc)); legA.position.set(-.18, .1, 0); g.add(legA);
  const legC = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .55, 6), mat(0xcccccc)); legC.position.set(.18, .2, 0); g.add(legC);
  g.position.set(x, .35, -1.2); track(g, name, step); return g;
}
led(-4.3, 0x35d07c, "ledVerde", 4);
led(-3.0, 0xf2c23e, "ledAmarillo", 5);
led(-1.7, 0xe8564d, "ledRojo", 6);
// Resistencias
function resistor(x, z1, z2, name, step, bands) {
  const g = new THREE.Group();
  const len = Math.abs(z2 - z1);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, len*.62, 10), mat(0xd8b98a));
  body.rotation.x = Math.PI/2; body.position.set(0, .16, (z1+z2)/2); g.add(body);
  bands.forEach((c, i) => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, .08, 10), mat(c));
    b.rotation.x = Math.PI/2; b.position.set(0, .16, (z1+z2)/2 - len*.18 + i*.14); g.add(b);
  });
  [[z1, len*.19], [z2, len*.19]].forEach(([z]) => {
    const wire = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, Math.abs(z2-z1) - len*.62 + .3, 6), mat(0xb8b8b8));
    wire.rotation.x = Math.PI/2; wire.position.set(0, .16, (z1+z2)/2); g.add(wire);
  });
  g.position.set(x, .35, 0); track(g, name, step);
}
resistor(-4.48, -1.2, .4, "r220v", 4, [0x8a4b2a, 0xd23c3c, 0x8a4b2a]);   // 220Ω rojo-rojo-café
resistor(-3.18, -1.2, .4, "r220a", 5, [0x8a4b2a, 0xd23c3c, 0x8a4b2a]);
resistor(-1.88, -1.2, .4, "r220r", 6, [0x8a4b2a, 0xd23c3c, 0x8a4b2a]);
resistor(2.2, .2, 1.3, "r1k", 9, [0x8a4b2a, 0x141414, 0xd23c3c]);        // 1 kΩ café-negro-rojo
resistor(2.2, 1.3, 2.5, "r2k", 9, [0xd23c3c, 0x141414, 0xd23c3c]);       // 2 kΩ rojo-negro-rojo
// Módulo relé
const relay = new THREE.Group();
const rbox = new THREE.Mesh(new THREE.BoxGeometry(2.3, 1.05, 1.6), mat(0x1f5fa8)); rbox.position.y = .55; relay.add(rbox);
const rcube = new THREE.Mesh(new THREE.BoxGeometry(.9, .6, .7), mat(0x2b7fd4, 0x0a2036)); rcube.position.set(.35, .9, 0); relay.add(rcube);
[-.55, -.15, .25].forEach((x, i) => {
  const s = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .2, 10), mat(0xb8bcc0, 0x40484e));
  s.position.set(x, .25, -.82); relay.add(s);
});
relay.position.set(9.4, 0, -.6); track(relay, "relay", 7);
// HC-05
const hc = new THREE.Group();
const pcb2 = new THREE.Mesh(new THREE.BoxGeometry(1.7, .12, .95), mat(0x14532d)); pcb2.position.y = .4; hc.add(pcb2);
const can = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .45, 14), mat(0xb8bcc0, 0x40484e));
can.rotation.x = Math.PI/2; can.position.set(-.2, .68, 0); hc.add(can);
const botton = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, .1, 12), mat(0xd8d8d8));
botton.position.set(.55, .5, .25); hc.add(botton);
hc.position.set(3.4, .35, 1.7); track(hc, "hc05", 8);

// ---------- Cables ----------
const WIREC = { rojo: 0xd23c3c, negro: 0x242424, azul: 0x3567d2, amarillo: 0xd2b23c, verde: 0x2fa05a };
const wires = [];
function wire(a, b, color, step, name) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const mid = va.clone().add(vb).multiplyScalar(.5); mid.y = Math.max(va.y, vb.y) + 1.1;
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([va, mid, vb]), 24, .06, 8), mat(WIREC[color]));
  tube.userData.step = step; scene.add(tube); wires.push(tube); if (name) focusables[name] = tube;
  return tube;
}
const B = (x, z) => [x, .42, .8 + z];     // punto en un hueco de la protoboard
const RAILR = [0, .42, .8 - 3.35], RAILR2 = [0, .42, .8 + 3.0], RAILB = [0, .42, .8 - 3.0], RAILB2 = [0, .42, .8 + 3.35];
// paso 2: alimentación
wire([-6.9, .5, -4.3], [-3.5, .42, .8 - 3.32], "rojo", 2, "w5v");
wire([-6.5, .5, -4.3], [-3.0, .42, .8 - 3.32], "negro", 2, "wgnd");
// paso 3: DHT11
wire(B(4.35, -1.7), PIN["D2"], "azul", 3, "wdht");
wire(B(4.6, -1.7), [-4.9, .42, .8 - 3.02], "rojo", 3);
wire(B(4.85, -1.7), [-4.4, .42, .8 - 3.32], "negro", 3);
// pasos 4-6: LEDs (ánodo → resistencia → D; cátodo → GND)
[[-4.3, -4.48, "D3", 4], [-3.0, -3.18, "D4", 5], [-1.7, -1.88, "D5", 6]].forEach(([x, rx, pin, st]) => {
  wire(B(x - .18, -1.2), B(rx, .4), "amarillo", st);          // ánodo a la resistencia
  wire(B(rx, .4), PIN[pin], "amarillo", st, "w" + pin);       // resistencia al pin
  wire(B(x + .18, -1.2), [x + .18, .42, .8 + 3.0], "negro", st); // cátodo a riel GND
});
// paso 7: relé
wire(PIN["D8"], [8.85, .45, -1.42], "amarillo", 7, "wrel");
wire([8.6, .45, .1], [2.5, .42, .8 + 3.0], "rojo", 7);
wire([9.0, .45, .1], [2.0, .42, .8 + 3.32], "negro", 7);
// paso 8: HC-05 alimentación y TXD
wire(B(2.9, 1.7), [-2.2, .42, .8 - 3.02], "rojo", 8);
wire(B(3.15, 1.7), [-1.7, .42, .8 - 3.32], "negro", 8);
wire(B(3.9, 1.7), PIN["D10"], "amarillo", 8, "wtx");
// paso 9: divisor RXD
wire(PIN["D11"], B(2.2, .2), "verde", 9, "wdiv1");
wire(B(2.2, 1.3), B(2.75, 1.7), "verde", 9, "wdiv2");
wire(B(2.2, 2.5), [1.4, .42, .8 - 3.32], "negro", 9, "wdiv3");

// ---------- Pasos ----------
const STEPS = [
  { t: "El tablero, de un vistazo", x: "Esto es lo que vas a armar: el Arduino Uno R3 (atrás), la protoboard y todos los módulos. Gira la escena con el dedo o el mouse para reconocer cada pieza. Avanza con «Siguiente» y cada paso resalta en verde lo que toca conectar.", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [] },
  { t: "Rieles de alimentación", x: "Dos cables desde el Arduino hacia los rieles largos de la protoboard:\n• ROJO: pin 5V del Arduino → riel rojo (+).\n• NEGRO: pin GND → riel azul (−).\nTodo lo demás se alimenta desde estos rieles, nunca directo del Arduino.", cam: { p: [-9, 8, 2], l: [-5, 0, -2] }, hi: ["w5v", "wgnd"] },
  { t: "Sensor DHT11 en D2", x: "Clava el DHT11 en la protoboard (zona derecha) y conecta:\n• Cable AZUL: pin S (datos) → hueco bajo el sensor y de ahí → pin D2.\n• ROJO: VCC → riel rojo.\n• NEGRO: GND → riel azul.\nDeja el cable de datos corto (< 30 cm).", cam: { p: [9, 7, -1], l: [3, .5, -2] }, hi: ["dht", "wdht"] },
  { t: "LED verde + su resistencia 220Ω", x: "El LED tiene pata LARGA (ánodo +) y CORTA (cátodo −). Clávalo en dos huecos separados.\nLa resistencia 220Ω (franjas rojo-rojo-café) va EN SERIE con la pata larga: de la fila del ánodo cruza el canal central hasta la fila de arriba. Sin ella, el LED se quema.\nDespués: amarillo desde esa fila → pin D3, y negro desde la pata corta → riel azul (GND).", cam: { p: [-7.5, 6, 3.5], l: [-4.3, .5, -.8] }, hi: ["ledVerde", "r220v", "wD3"] },
  { t: "LED amarillo en D4", x: "Igual que el anterior: LED amarillo dos filas al lado, pata larga hacia la resistencia 220Ω que cruza el canal, y de ahí:\n• Cable AMARILLO → pin D4.\n• NEGRO desde la pata corta → riel azul.", cam: { p: [-6.5, 6, 4.5], l: [-3, .5, -.8] }, hi: ["ledAmarillo", "r220a", "wD4"] },
  { t: "LED rojo en D5", x: "Tercer LED, mismo molde: resistencia 220Ω en serie con la pata larga, cable AMARILLO desde la fila superior → pin D5, y NEGRO desde la pata corta → riel azul.\nEste es el LED de helada: es el que prende junto al CLIC del relé.", cam: { p: [-5.5, 6, 5.5], l: [-1.7, .5, -.8] }, hi: ["ledRojo", "r220r", "wD5"] },
  { t: "Módulo relé (bomba) en D8", x: "El relé queda a la derecha de la protoboard:\n• Cable AMARILLO: pin IN del módulo → pin D8.\n• ROJO: VCC → riel rojo. NEGRO: GND → riel azul.\nLa lógica es Active LOW: LOW enciende la bomba, HIGH la apaga. Los tornillos de carga quedan VACÍOS en el laboratorio (nada de 220 V).", cam: { p: [12, 7, 4], l: [8, .5, -1] }, hi: ["relay", "wrel"] },
  { t: "Bluetooth HC-05: alimentación y TXD", x: "Clava el HC-05 en la protoboard:\n• ROJO: VCC → riel rojo. NEGRO: GND → riel azul.\n• AMARILLO: TXD del módulo → pin D10 (aquí va DIRECTO: el módulo manda 3.3 V y el Arduino lo lee bien).\nCuando lo alimentes, su LED debe parpadear rápido.", cam: { p: [7, 6, 6], l: [3, .5, 1] }, hi: ["hc05", "wtx"] },
  { t: "Divisor de tensión para RXD (¡no lo saltes!)", x: "El RXD del HC-05 es de 3.3 V y el Arduino manda 5 V por D11: hay que bajarle la tensión con DOS resistencias en serie:\n• D11 → cable VERDE → hueco A.\n• 1 kΩ (café-negro-rojo) del hueco A al hueco B.\n• Del hueco B → cable VERDE → RXD del módulo.\n• 2 kΩ (rojo-negro-rojo) del hueco B hacia abajo, y NEGRO → riel azul (GND).\nSin esto puedes dañar el módulo.", cam: { p: [5, 6.5, 6.5], l: [2.2, .5, 1.2] }, hi: ["r1k", "r2k", "wdiv1", "wdiv2", "wdiv3"] },
  { t: "Revisión final", x: "Compara con la escena:\n• Verde, amarillo y rojo en D3/D4/D5 con sus 220Ω.\n• Relé IN en D8 y HC-05 en D10/D11 con el divisor.\nAl alimentar por USB: LED verde fijo, relé silencioso y el HC-05 parpadeando rápido. Si algo no coincide, vuelve al paso de esa rama.", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [] },
  { t: "¡Armado! Ahora el firmware", x: "Conecta el Arduino al PC por USB y sigue la guía: docs/CABLEADO_ARDUINO.md (IDE, librería DHT, subir el sketch ya verificado).\nPrueba en el Monitor Serie a 9600: tramas TELEMETRIA cada 2 s y órdenes 1 / 0 / A con CLIC del relé.\nDespués vincula el HC-05 y sigue docs/BLUETOOTH.md con la app. ¡Éxito en la demo!", cam: { p: [13, 12, 19], l: [0, 0, 0] }, hi: [], link: "https://github.com/DarioChino/agroalert-araucania/blob/main/docs/CABLEADO_ARDUINO.md" }
];

// ---------- Visibilidad por paso ----------
function applyStep(i) {
  for (const k in stepObjects) stepObjects[k].obj.visible = i >= stepObjects[k].step;
  wires.forEach(w => w.visible = i >= w.userData.step);
}
applyStep(0);

// ---------- UI ----------
const $ = id => document.getElementById(id);
let cur = 0;
$("dots").innerHTML = STEPS.map(() => "<span></span>").join("");
function show(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $("stepNum").textContent = `PASO ${cur+1} DE ${STEPS.length}`;
  $("title").textContent = s.t;
  $("text").innerHTML = s.x.replace(/\n/g, "<br>") + (s.link ? `<br><br><a href="${s.link}" target="_blank">Abrir guía de compilación ▸</a>` : "");
  $("prev").disabled = cur === 0;
  $("next").textContent = cur === STEPS.length - 1 ? "↻ Volver al inicio" : "Siguiente ▶";
  [...$("dots").children].forEach((d, k) => d.className = k <= cur ? "on" : "");
  applyStep(cur);
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur === STEPS.length - 1 ? 0 : cur + 1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
show(0);

// ---------- Animación ----------
const camTarget = new THREE.Vector3(0, 0, 0), camPos = new THREE.Vector3(13, 12, 19);
const pulse = new THREE.Color(0x57c98f);
let t0 = 0;
function animate(t) {
  requestAnimationFrame(animate);
  const s = STEPS[cur];
  camPos.lerp(new THREE.Vector3(...s.cam.p), .06);
  camTarget.lerp(new THREE.Vector3(...s.cam.l), .06);
  camera.position.copy(camPos); controls.target.copy(camTarget);
  const k = (Math.sin((t - t0) * .005) + 1) / 2;
  for (const name in focusables) {
    const obj = focusables[name];
    const on = (s.hi || []).includes(name);
